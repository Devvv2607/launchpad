name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan full history, not just the tip
      # Same pinned gitleaks version as .pre-commit-config.yaml, so local and CI agree.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz             | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks (full history)
        run: |
          set +e
          gitleaks git --redact --no-banner --report-format json --report-path leaks.json .
          code=$?
          if [ "$code" -ne 0 ]; then
            # Surface each (redacted) finding as an annotation so it is visible without log access.
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:8])"' leaks.json
          fi
          exit $code

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: launchpad
          POSTGRES_PASSWORD: launchpad
          POSTGRES_DB: launchpad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U launchpad" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://launchpad:launchpad@localhost:5432/launchpad_test
      DATABASE_URL: postgresql+asyncpg://launchpad:launchpad@localhost:5432/launchpad_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: Install
        run: pip install -e "./api[dev]" -e ./worker
      - name: Lint (ruff)
        run: |
          cd api && ruff check . && ruff format --check .
          cd ../worker && ruff check . && ruff format --check .
      - name: Type-check (mypy strict)
        run: |
          cd api && mypy
          cd ../worker && mypy
      - name: Migrations apply cleanly and match the models
        working-directory: api
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Test API
        working-directory: api
        run: pytest
      - name: Test worker
        working-directory: worker
        run: pytest
      - name: OpenAPI spec is up to date
        run: |
          cd api && python -m launchpad.openapi > ../web/openapi.json
          git diff --exit-code -- ../web/openapi.json || (echo "Run 'make gen-api' and commit." && exit 1)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated client matches openapi.json
        run: npm run -s gen:api && git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run -s lint
      - run: npm run -s format:check
      - run: npm run -s typecheck
      - run: npm run -s build

  docker:
    runs-on: ubuntu-latest
    needs: [secrets, backend, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build all images
        run: cp .env.example .env && docker compose build

  windows-tasks:
    # Keeps the no-make path (scripts/tasks.py) working for Windows contributors.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python scripts/tasks.py setup
      - run: python scripts/tasks.py lint
      - run: python scripts/tasks.py typecheck
