[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "launchpad-worker"
version = "0.1.0"
description = "Launchpad background worker (ARQ): scheduled publishing and long-running jobs"
requires-python = ">=3.11"
# Shares models/config with the API. Install ../api first (see Makefile / Dockerfile).
dependencies = ["launchpad"]

[tool.hatch.build.targets.wheel]
packages = ["src/launchpad_worker"]

[tool.ruff]
extend = "../api/pyproject.toml"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["launchpad_worker"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
