[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "launchpad"
version = "0.1.0"
description = "Launchpad — agentic AI marketing platform (API + shared domain code)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "structlog>=24.4",
  "httpx>=0.27",
  "arq>=0.26",
  "redis>=5.0",
  "python-multipart>=0.0.9",
  "tzdata>=2024.1",
  "boto3>=1.35",
  "pillow>=10.4",
  "jinja2>=3.1",
  "anthropic>=1.11",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "nh3>=0.2.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "respx>=0.21",
  "pre-commit>=3.8",
  "boto3-stubs[s3]>=1.35",
]

[tool.hatch.build.targets.wheel]
packages = ["src/launchpad"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["launchpad", "launchpad_worker", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]  # fixture payloads read best on one line
"alembic/**" = ["E501", "F401"]
"src/launchpad/llm/pricing.py" = ["E501"]  # one row per model reads best
# Prompt guidance + user-facing rule messages: full sentences read better unwrapped.
"src/launchpad/content/engine.py" = ["E501"]
"src/launchpad/content/platform_rules.py" = ["E501"]
"evals/**" = ["E501", "S101", "S603", "S607"]  # report templates, fixtures, git sha lookup

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["launchpad"]

[[tool.mypy.overrides]]
module = ["arq.*", "pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Tests import shared fakes as `tests.*`; make that work for plain `pytest` too (CI).
pythonpath = ["."]
markers = ["live: calls real provider APIs (needs keys + RUN_LIVE_TESTS=1)"]
