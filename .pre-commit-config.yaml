# Install once: `make setup` (runs `pre-commit install`). Run on everything: `pre-commit run -a`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(web/openapi\.json|web/src/lib/api/schema\.d\.ts)$
      - id: trailing-whitespace
        exclude: \.md$

  # Secret scanning: blocks API keys, tokens and passwords before they reach git history.
  # Same scanner and rules as CI (which also scans the full history).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, api + worker)
        entry: scripts/hooks/mypy.sh
        language: script
        files: ^(api|worker)/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint (web)
        entry: scripts/hooks/web.sh eslint
        language: script
        files: ^web/src/.*\.(ts|tsx)$
      - id: prettier
        name: prettier (web)
        entry: scripts/hooks/web.sh prettier
        language: script
        files: ^web/
        exclude: ^web/(openapi\.json|package-lock\.json|src/lib/api/schema\.d\.ts|src/components/ui/)
